# Python style
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", "node_modules"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002"]  # line length handled by formatter, allow en-dash

[lint.isort]
known-first-party = ["cs2_sidecar"]

[format]
quote-style = "double"
indent-style = "space"
