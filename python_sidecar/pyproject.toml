[project]
name = "cs2-sidecar"
version = "0.1.0"
description = "Python sidecar for CS2 Demo Analyzer (awpy-backed analytics)"
requires-python = ">=3.11"
authors = [{ name = "CS2 Analyzer Team" }]
license = { text = "MIT" }

dependencies = [
    "awpy>=1.2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=0.40",
    "scipy>=1.11",
    "pyrr>=0.10.3",
    "trimesh>=4.0",
    "rtree>=1.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "black>=24.2",
]

[project.scripts]
cs2-sidecar = "cs2_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
