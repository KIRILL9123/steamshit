[package]
name = "cs2-analyzer"
version = "0.1.1"
description = "CS2 Demo Analyzer — Tauri 2 desktop app"
authors = ["CS2 Analyzer Team"]
edition = "2021"
license = "MIT"

[lib]
name = "cs2_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cs2-analyzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# DB
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
refinery = { version = "0.8", features = ["rusqlite"] }

# DataFrames — used by the sidecar contract (Polars → JSON in Python) and by
# any Rust-side analytics we want to run on already-parsed data. We keep
# the surface area small (parquet + ipc + lazy) since most aggregation
# happens server-side (SQL) once events are in SQLite.
polars = { version = "0.40", default-features = false, features = ["parquet", "ipc", "lazy", "round_series"] }

# Demo parsing is delegated to the Python sidecar (awpy / demoparser2).
# See `python_sidecar/src/cs2_sidecar/methods/parser.py`.

# Compression (for .dem.zst and any future in-process zstd work)
zstd = "0.13"

# Math/3D
glam = "0.27"
rayon = "1.10"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
once_cell = "1.19"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2.3.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
