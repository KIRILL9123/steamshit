[package]
name = "cs2-analyzer"
version = "0.1.0"
description = "CS2 Demo Analyzer — Tauri 2 desktop app"
authors = ["CS2 Analyzer Team"]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[lib]
name = "cs2_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cs2-analyzer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# DB
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
refinery = { version = "0.8", features = ["rusqlite"] }

# DataFrames
polars = { version = "0.40", default-features = false, features = ["parquet", "ipc", "lazy", "round_series"] }

# Demo parser
# demoparser2 = { git = "https://github.com/LaihoE/demoparser" }

# Compression
zstd = "0.13"

# Math/3D
glam = "0.27"
rayon = "1.10"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
once_cell = "1.19"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
